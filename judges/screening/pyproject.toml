[project]
name = "screening-judge"
version = "0.1.0"
description = "Reusable, source-cited screening of preserved web evidence for hacking, AI-agent activity and agent coordination"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.0"]

[project.optional-dependencies]
prepare = ["transformers"]

[project.scripts]
screening-judge = "screening_judge.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
packages = ["screening_judge", "screening_judge_config"]
package-dir = {"" = "src", "screening_judge_config" = "config"}

[tool.setuptools.package-data]
screening_judge_config = ["*.txt", "*.json", "axes/*.txt", "shapes/*.txt"]
